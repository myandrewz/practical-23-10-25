spring.application.name=ticket-line

# Server Configuration
server.port=8080

# Database Configuration - H2 (for development)
spring.datasource.url=jdbc:h2:mem:ticketline_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Uncomment below for PostgreSQL (production)
#spring.datasource.url=jdbc:postgresql://localhost:5432/tickets_db
#spring.datasource.username=myuser
#spring.datasource.password=mypassword
#spring.datasource.driverClassName=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For PostgreSQL, use: org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=ThisIsAVeryLongSecretKeyForJWTTokenGenerationAndValidationPurposesOnly123456789
jwt.expiration=3600000

# Ticket Reservation Configuration
ticket.reservation.expiration.minutes=15

# Logging Configuration
logging.level.dev.brightkan.ticket_line=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
